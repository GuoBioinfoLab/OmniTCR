[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnitcr"
version = "1.0.0"
description = "Reproducible inference API for OmniTCR binding prediction, cancer screening and TCR generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub>=0.24,<2",
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "safetensors>=0.4,<1",
    "torch>=2.1,<3",
    "transformers>=4.43,<5",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
omnitcr = "omnitcr.cli:main"

[project.urls]
"Model weights" = "https://huggingface.co/loveCloud/OmniTCR"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omnitcr = ["resources/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"
